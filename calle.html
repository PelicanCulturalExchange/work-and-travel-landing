<!doctype html>
<html lang="es-EC">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a3443">
<title>La Calle | Pelican Cultural Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #145d84; --navy: #1a3443; --deep: #064c5a; --teal: #3fa4a3; --green: #55b149; --neon: #70ff71;
  --mint: #cdfbd3; --mint-2: #b4f7c0; --salmon: #f8a8a9; --white: #ffffff; --ink: #0f3a4d;
  --font: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--navy); color: var(--white); font-family: var(--font); font-size: 16px; line-height: 1.5; padding-bottom: 60px; }
[hidden] { display: none !important; }
button { font-family: inherit; }
.top { background: var(--white); padding: 8px max(16px, env(safe-area-inset-left)); display: flex; align-items: center; justify-content: space-between; }
.top img { display: block; width: 86px; height: auto; }
.pill { background: var(--navy); color: var(--neon); font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 999px; }
main { max-width: 640px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right)); }
h1, h2, h3 { margin: 0; line-height: 1.2; }
.card { background: var(--white); color: var(--ink); border-radius: 24px; padding: 18px 16px; margin-top: 14px; box-shadow: 0 8px 0 var(--deep); }
.card h2 { font-size: 22px; color: var(--blue); }
.card h3 { font-size: 17px; color: var(--blue); }
.card p { margin: 6px 0 0; }
.hint { font-size: 14px; color: var(--deep); }
.lbl { display: block; font-weight: 700; font-size: 14px; color: var(--deep); margin: 14px 0 6px; }
input[type=text], input[type=tel], input[type=password], input[type=time], input[type=number] {
  width: 100%; font: inherit; font-size: 18px; color: var(--ink); min-height: 52px; padding: 12px 14px; appearance: none;
  background: color-mix(in srgb, var(--blue) 7%, var(--white)); border: 2px solid color-mix(in srgb, var(--blue) 25%, var(--white)); border-radius: 14px;
}
input:focus, textarea:focus { outline: none; border-color: var(--blue); background: var(--white); box-shadow: 0 0 0 4px color-mix(in srgb, var(--teal) 40%, var(--white)); }
textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); min-height: 120px; padding: 12px 14px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--blue) 25%, var(--white)); background: color-mix(in srgb, var(--blue) 7%, var(--white)); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; margin-top: 14px; padding: 12px 20px; border: 0; border-radius: 16px; cursor: pointer;
  font-weight: 700; font-size: 18px; background: var(--neon); color: var(--deep); box-shadow: 0 5px 0 var(--green); text-align: center; text-decoration: none; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--green); }
.btn.blue { background: var(--blue); color: var(--white); box-shadow: 0 5px 0 var(--deep); }
.btn.ghost { background: transparent; color: var(--blue); border: 2px solid var(--blue); box-shadow: none; }
.btn.salmon { background: var(--salmon); color: var(--deep); box-shadow: 0 5px 0 color-mix(in srgb, var(--salmon) 60%, var(--deep)); }
.btn.small { min-height: 44px; font-size: 15px; margin-top: 10px; }
.btn[disabled] { opacity: .6; }
.link { background: none; border: 0; color: var(--blue); font-weight: 700; font-size: 14px; text-decoration: underline; cursor: pointer; padding: 6px 2px; }
.err { background: var(--salmon); color: var(--deep); font-weight: 700; font-size: 14px; border-radius: 10px; padding: 8px 12px; margin-top: 8px; }
.err:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { min-height: 46px; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 16px; cursor: pointer; color: var(--ink);
  background: color-mix(in srgb, var(--blue) 7%, var(--white)); border: 2px solid color-mix(in srgb, var(--blue) 25%, var(--white)); }
.chip.sel { background: var(--mint); border-color: var(--green); }
.stepper { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.stepper button { width: 56px; height: 56px; border-radius: 16px; border: 2px solid var(--blue); background: var(--white); color: var(--blue); font-size: 28px; font-weight: 700; cursor: pointer; }
.stepper input { text-align: center; font-size: 28px; font-weight: 800; color: var(--blue); }
.net { background: var(--salmon); color: var(--deep); font-weight: 700; font-size: 14px; text-align: center; padding: 8px 12px; border-radius: 12px; margin-top: 12px; }
.sub { color: var(--mint); font-size: 14px; margin-top: 12px; }

/* HUD: cuenta regresiva */
.hud { position: sticky; top: 0; z-index: 20; background: linear-gradient(180deg, var(--deep), var(--navy)); border-bottom: 3px solid var(--neon); padding: 10px max(16px, env(safe-area-inset-left)) 12px; text-align: center; }
.hud-row { display: flex; justify-content: space-between; align-items: center; max-width: 640px; margin: 0 auto; font-weight: 700; font-size: 14px; }
.hud .uni { color: var(--neon); text-transform: uppercase; letter-spacing: .06em; }
.hud .hasta { color: var(--mint); }
.clock { font-size: 46px; font-weight: 800; letter-spacing: .02em; font-variant-numeric: tabular-nums; line-height: 1.05; color: var(--white); margin-top: 2px; }
.clock-sub { font-size: 13px; color: var(--mint); margin-top: -2px; }
.tbar { max-width: 640px; margin: 8px auto 0; height: 10px; background: color-mix(in srgb, var(--white) 14%, transparent); border-radius: 999px; overflow: hidden; }
.tbar span { display: block; height: 100%; background: var(--neon); border-radius: 999px; transition: width 1s linear; }
.hud.warn .clock { color: var(--salmon); }
.hud.warn .tbar span, .hud.over .tbar span { background: var(--salmon); }
.hud.over .clock { color: var(--salmon); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .55; } }

/* progreso de la meta */
.prog-top { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: var(--deep); font-size: 14px; }
.big { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
.big b { font-size: 52px; line-height: 1; color: var(--blue); font-weight: 800; }
.big span { font-size: 22px; font-weight: 700; color: var(--deep); }
.big em { margin-left: auto; font-style: normal; font-size: 26px; font-weight: 800; color: var(--green); }
.pbar { position: relative; height: 22px; margin-top: 10px; border-radius: 999px; background: color-mix(in srgb, var(--blue) 14%, var(--white)); overflow: hidden; }
.pbar span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--green), var(--neon)); transition: width .5s; }
.pbar i { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--white); opacity: .9; }
.msg { font-weight: 800; color: var(--blue); font-size: 18px; margin-top: 10px !important; }
.pace, .mine { font-size: 14px; color: var(--deep); }
.card.win { box-shadow: 0 8px 0 var(--green), 0 0 0 4px var(--neon); }
.confetti { position: fixed; top: -12px; width: 10px; height: 16px; z-index: 60; border-radius: 2px; animation: fall 2.6s ease-in forwards; pointer-events: none; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .9; } }

/* equipo */
.team-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-top: 8px; border-radius: 14px; background: color-mix(in srgb, var(--blue) 7%, var(--white)); }
.team-row b { font-size: 16px; }
.team-row small { display: block; color: var(--deep); font-size: 13px; }
.team-row .grow { flex: 1; min-width: 0; }
.team-row button { min-height: 40px; padding: 6px 12px; border-radius: 12px; border: 2px solid var(--blue); background: var(--white); color: var(--blue); font-weight: 700; font-size: 14px; cursor: pointer; }
.team-row button.sure { background: var(--salmon); border-color: var(--salmon); color: var(--deep); }
.team-row.gone { opacity: .75; }

/* lista grande */
.row { display: grid; grid-template-columns: 26px 1fr 1.15fr 30px; gap: 6px; align-items: center; margin-top: 8px; }
.row .n { font-size: 13px; font-weight: 700; color: var(--deep); text-align: center; }
.row input { min-height: 48px; font-size: 16px; padding: 8px 10px; border-radius: 12px; }
.row .st { font-size: 20px; text-align: center; color: var(--deep); }
.row.sent .st { color: var(--green); }
.row .meta { grid-column: 2 / 5; font-size: 12px; color: var(--deep); margin-top: -2px; }
.row .meta .bad { background: var(--salmon); font-weight: 700; padding: 3px 8px; border-radius: 8px; display: inline-block; }
.row.rep input { border-color: var(--salmon); }
.listhead { display: flex; justify-content: space-between; align-items: center; }

/* hoja inferior */
.sheet-bg { position: fixed; inset: 0; background: color-mix(in srgb, var(--navy) 70%, transparent); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--white); color: var(--ink); width: 100%; max-width: 640px; border-radius: 24px 24px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 88vh; overflow: auto; }
.sheet h3 { color: var(--blue); font-size: 20px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.stat { background: color-mix(in srgb, var(--blue) 7%, var(--white)); border-radius: 14px; padding: 12px; }
.stat b { display: block; font-size: 24px; color: var(--blue); line-height: 1.1; }
.stat small { color: var(--deep); font-size: 13px; }
</style>
</head>

<script>
(function () {
  "use strict";
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbz3gIQzMY5WloiWMoKH-4dkKIWqQkBjtjDCDkQf39l3ePQOAPBAvlVywcVQ2cn154-r/exec";
  var ASESORES = ["Alejo", "Mafer", "Meli", "Adrian", "Jeff", "Elian"];
  var UNIS = [{ n: "U. Central", fin: "12:00" }, { n: "ESPE", fin: "17:45" }];
  var TZ = "America/Guayaquil";
  var KEY = "pelican_calle_v1";

  /* ---------- estado ---------- */
  function blank() { return { pin: "", asesor: "", salida: null, team: [], myMid: "", serverLeads: 0, rows: [], outbox: [], skew: 0, resumen: null, celebrated: {} }; }
  var S = (function () { try { var j = JSON.parse(localStorage.getItem(KEY)); if (j && typeof j === "object") return Object.assign(blank(), j); } catch (e) { } return blank(); })();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
  var online = true, flushing = false, syncing = false, cfg = null, confirmLeave = "", syncTimer = null;

  /* ---------- utilidades ---------- */
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function nowMs() { return Date.now() + (S.skew || 0); }
  function nowIso() { return new Date(nowMs()).toISOString(); }
  var fmtHM = new Intl.DateTimeFormat("es-EC", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ });
  var fmtYMD = new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit", timeZone: TZ });
  function hm(ms) { return fmtHM.format(new Date(ms)); }
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function hms(ms) { ms = Math.max(0, Math.floor(ms / 1000)); return two(Math.floor(ms / 3600)) + ":" + two(Math.floor(ms / 60) % 60) + ":" + two(ms % 60); }
  function human(ms) { var m = Math.round(ms / 60000); return m >= 60 ? Math.floor(m / 60) + " h" + (m % 60 ? " " + two(m % 60) + " min" : "") : m + " min"; }
  function todayAt(hhmm) { return Date.parse(fmtYMD.format(new Date(nowMs())) + "T" + hhmm + ":00-05:00"); }
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }

  function normPhone(v) {
    var d = String(v || "").replace(/\D/g, "");
    if (d.indexOf("593") === 0 && d.length === 12) d = d.slice(3);
    else if (d.length === 10 && d.charAt(0) === "0") d = d.slice(1);
    if (!/^9\d{8}$/.test(d)) return null;
    if (/(\d)\1{5,}/.test(d) || /(123456|234567|345678|456789|987654|876543|765432|654321|543210)/.test(d)) return "fake";
    return "+593" + d;
  }
  function pretty(p) { return "0" + p.slice(4, 6) + " " + p.slice(6, 9) + " " + p.slice(9); }

  /* ---------- red ---------- */
  function net(url, opts, ms) {
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, ms || 20000);
    opts = opts || {}; if (ctl) opts.signal = ctl.signal;
    return fetch(url, opts).then(function (r) { return r.json(); }).then(function (j) { clearTimeout(t); return j; }, function (e) { clearTimeout(t); throw e; });
  }
  function setOnline(v) { if (online !== v) { online = v; var n = $("net"); if (n) n.hidden = v; } }
  function setSkew(ahora) { var t = Date.parse(ahora); if (!isNaN(t)) S.skew = t - Date.now(); }
  function api(p) {
    p = Object.assign({ pin: S.pin }, p);
    return net(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) }).then(function (j) { if (j && j.ahora) setSkew(j.ahora); return j; });
  }
  function apiGet(params) {
    var q = Object.keys(params).map(function (k) { return k + "=" + encodeURIComponent(params[k]); }).join("&");
    return net(ENDPOINT + "?" + q + "&pin=" + encodeURIComponent(S.pin), { method: "GET" }).then(function (j) { if (j && j.ahora) setSkew(j.ahora); return j; });
  }
  function logout(msg) { S.pin = ""; S.salida = null; S.team = []; save(); render(msg); }

  /* acciones en cola (entrar, salir, meta, hora...) */
  function queue(p) { S.outbox.push(p); save(); flush(); }
  function flush() {
    if (flushing || !S.pin) return Promise.resolve();
    flushing = true;
    function step() {
      if (!S.outbox.length) return Promise.resolve();
      return api(S.outbox[0]).then(function (j) {
        if (j && j.error === "pin") { logout("La clave cambió. Vuelve a entrar."); return Promise.reject("pin"); }
        S.outbox.shift(); save(); setOnline(true); return step();
      }, function () { setOnline(false); return Promise.reject("net"); });
    }
    return step().catch(function () { }).then(function () { flushing = false; });
  }

  /* ---------- filas / leads ---------- */
  function isValid(r) { return String(r.nombre || "").trim().length >= 2 && !!normPhone(r.tel) && normPhone(r.tel) !== "fake"; }
  function pending() { return S.rows.filter(function (r) { return isValid(r) && (!r.sent || r.dirty); }); }
  function newRow() { return { id: "L" + uid(), sid: S.salida ? S.salida.id : "", uni: S.salida ? S.salida.universidad : "", asesor: S.asesor, nombre: "", tel: "", hora: "", sent: false, dirty: false, rep: false, ver: 0, err: "" }; }
  function rowById(id) { for (var i = 0; i < S.rows.length; i++) if (S.rows[i].id === id) return S.rows[i]; return null; }
  function syncLeads() {
    if (syncing || !S.pin) return Promise.resolve();
    var list = pending().slice(0, 40);
    if (!list.length) return Promise.resolve();
    syncing = true;
    var vers = {}; list.forEach(function (r) { vers[r.id] = r.ver; });
    return api({ accion: "calle_leads", leads: list.map(function (r) { return { id: r.id, nombre: r.nombre.trim(), whatsapp: normPhone(r.tel), universidad: r.uni, asesor: r.asesor, salida: r.sid, hora: r.hora }; }) }).then(function (j) {
      syncing = false; setOnline(true);
      if (j && j.error === "pin") { logout("La clave cambió. Vuelve a entrar."); return; }
      ((j && j.resultados) || []).forEach(function (x) {
        var r = rowById(x.id); if (!r) return;
        if (x.ok) { if (r.ver === vers[x.id]) { r.sent = true; r.dirty = false; } r.rep = !!x.repetido; r.err = ""; } else r.err = "No se pudo guardar";
      });
      save(); updateRows(); updateProgress(); updateTeam();
      if (pending().length) scheduleSync(1500);
    }, function () { syncing = false; setOnline(false); });
  }
  function runSync() { return flush().then(syncLeads); }
  function scheduleSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(runSync, ms); }

  /* ---------- cifras de la salida ---------- */
  function uncounted() { return S.rows.filter(function (r) { return isValid(r) && !r.counted && S.salida && r.sid === S.salida.id; }); }
  function totalLeads() { return (S.serverLeads || 0) + uncounted().length; }
  function mineLeads() { return S.rows.filter(function (r) { return isValid(r) && r.sid === (S.salida && S.salida.id); }).length; }

  /* ---------- salida: crear, unirse, equipo ---------- */
  function startSalida(c) {
    var id = "S" + uid(), now = nowMs(), team = [], me = null;
    c.asesores.forEach(function (a) { var t = { mid: "M" + uid(), asesor: a, entro: now, salio: 0, activo: true, leads: 0 }; if (a === S.asesor) me = t; team.push(t); });
    if (!me) { me = { mid: "M" + uid(), asesor: S.asesor, entro: now, salio: 0, activo: true, leads: 0 }; team.unshift(me); }
    S.salida = { id: id, universidad: c.uni, meta: c.meta, inicio: now, limite: c.limite, estado: "Activa" };
    S.team = team; S.myMid = me.mid; S.serverLeads = 0; S.resumen = null;
    S.rows = S.rows.filter(function (r) { return isValid(r) && (!r.sent || r.dirty); });   // se conservan solo los pendientes de salidas anteriores
    queue({ accion: "salida_crear", id: id, universidad: c.uni, meta: c.meta, limite: new Date(c.limite).toISOString(), inicio: new Date(now).toISOString(), creada_por: S.asesor, miembros: team.map(function (t) { return { mid: t.mid, asesor: t.asesor }; }) });
    render();
  }
  function joinSalida(id) {
    apiGet({ accion: "salida", id: id }).then(function (j) {
      if (!j || !j.ok) { alert2("No pude entrar a esa salida. Revisa tu señal."); return; }
      applyServer(j, true);
      var mine = S.team.filter(function (t) { return t.asesor === S.asesor && t.activo; })[0];
      if (mine) S.myMid = mine.mid;
      else { var t = { mid: "M" + uid(), asesor: S.asesor, entro: nowMs(), salio: 0, activo: true, leads: 0 }; S.team.push(t); S.myMid = t.mid; queue({ accion: "unirse", salida: id, mid: t.mid, asesor: S.asesor, hora: nowIso() }); }
      S.resumen = null; S.rows = S.rows.filter(function (r) { return isValid(r) && (!r.sent || r.dirty); });
      save(); render();
    }, function () { alert2("Sin señal: necesitas conexión para unirte a una salida."); });
  }
  function addMember(name, back) {
    name = String(name || "").trim().replace(/\s+/g, " ").slice(0, 40); if (!name) return;
    if (S.team.some(function (t) { return t.asesor === name && t.activo; })) return;
    var t = { mid: "M" + uid(), asesor: name, entro: nowMs(), salio: 0, activo: true, leads: 0 };
    S.team.push(t); save(); queue({ accion: "unirse", salida: S.salida.id, mid: t.mid, asesor: name, hora: nowIso() }); updateTeam(); updateProgress();
  }
  function memberLeaves(mid) {
    var t = S.team.filter(function (x) { return x.mid === mid; })[0]; if (!t || !t.activo) return;
    t.activo = false; t.salio = nowMs(); save();

  }
  function buildResumen(fin) {
    var s = S.salida, me = S.team.filter(function (t) { return t.mid === S.myMid; })[0];
    return { uni: s.universidad, meta: s.meta, total: totalLeads(), mine: mineLeads(), entro: me ? me.entro : s.inicio, salio: fin, equipo: S.team.length, inicio: s.inicio };

  function applyServer(j, force) {

    S.team = (j.equipo || []).map(function (m) { return { mid: m.mid, asesor: m.asesor, entro: Date.parse(m.entro) || nowMs(), salio: m.salio ? Date.parse(m.salio) : 0, activo: m.activo, leads: m.leads || 0 }; });

  function rowEl(r, n) {
    var d = document.createElement("div"); d.className = "row"; d.setAttribute("data-id", r.id);
    d.innerHTML = '<span class="n">' + n + '</span><input class="nm" type="text" placeholder="Nombre" autocomplete="off" autocapitalize="words" aria-label="Nombre ' + n + '"><input class="tl" type="tel" inputmode="tel" placeholder="09 9999 9999" autocomplete="off" aria-label="Celular ' + n + '"><span class="st" aria-live="polite"></span><div class="meta"></div>';
    d.querySelector(".nm").value = r.nombre; d.querySelector(".tl").value = r.tel; paintRow(d, r); return d;
  }
  function paintRow(d, r) {
    var ok = isValid(r), st = d.querySelector(".st"), meta = d.querySelector(".meta"), bits = [];
    d.classList.toggle("sent", !!r.sent && !r.dirty); d.classList.toggle("rep", !!r.rep);
    st.textContent = !ok ? "" : (r.sent && !r.dirty ? "✓" : "…"); st.title = !ok ? "" : (r.sent && !r.dirty ? "Enviado" : "Pendiente de enviar");
    if (ok && r.hora) bits.push(hm(Date.parse(r.hora)));
    if (ok) bits.push(r.sent && !r.dirty ? "enviado" : "pendiente");
    var html = bits.join(" · ");
    if (r.rep) html += ' <span class="bad">Ya estaba registrado antes</span>';
    if (r.err) html += ' <span class="bad">' + esc(r.err) + '</span>';
    meta.innerHTML = html;
  }
  function visibleRows() { return S.rows.filter(function (r) { return S.salida && r.sid === S.salida.id; }); }
  function updateRows() {
    var box = $("rows"); if (!box) return;
    [].forEach.call(box.children, function (d) { var r = rowById(d.getAttribute("data-id")); if (r && !d.contains(document.activeElement)) { paintRow(d, r); } else if (r) { paintRow(d, r); } });
    var p = pending().length;
    var si = $("syncinfo"); if (si) si.textContent = p ? p + " lead(s) por enviar" : "Todo enviado";
    var sb = $("send"); if (sb) sb.hidden = !p && online;
  }
  function addBlankIfNeeded() {
    var vis = visibleRows(), last = vis[vis.length - 1];
    if (!last || last.nombre || last.tel) { var r = newRow(); S.rows.push(r); $("rows").appendChild(rowEl(r, vis.length + 1)); }
  }
  function onRowInput(e) {
    var d = e.target.closest(".row"); if (!d) return; var r = rowById(d.getAttribute("data-id")); if (!r) return;
    if (e.target.classList.contains("nm")) r.nombre = e.target.value; else r.tel = e.target.value;
    r.ver++; if (r.sent) r.dirty = true; r.err = "";
    if (isValid(r) && !r.hora) r.hora = nowIso();
    addBlankIfNeeded(); paintRow(d, r); save(); updateProgress(); updateTeam(); updateRows();
    if (isValid(r)) scheduleSync(4000);

  function onRowBlur(e) {
    var d = e.target.closest && e.target.closest(".row"); if (!d || !e.target.classList.contains("tl")) return;
    var r = rowById(d.getAttribute("data-id")); if (!r) return;
    var meta = d.querySelector(".meta"), p = normPhone(r.tel);
    if (r.tel.trim() && !p) { meta.innerHTML = '<span class="bad">Debe ser un celular: 10 dígitos que empiezan con 09</span>'; return; }
    if (p === "fake") { meta.innerHTML = '<span class="bad">Ese número no parece real, revísalo</span>'; return; }
    if (p) { e.target.value = pretty(p); r.tel = e.target.value; save(); }
    if (r.tel.trim() && String(r.nombre).trim().length < 2) { meta.innerHTML = '<span class="bad">Falta el nombre</span>'; return; }
    paintRow(d, r);
  }

  function openPaste() {
    sheet('<h3>Pegar varios</h3><p class="hint">Una persona por línea, con nombre y celular. Ejemplo: Camila Andrade 0985271634</p><textarea id="pt" placeholder="Camila Andrade 0985271634&#10;Luis Mora, 0974412205"></textarea><div class="err" id="pe"></div><button class="btn" id="padd">Agregar a la lista</button><button class="btn ghost small" id="pno">Cancelar</button>', function (r) {
      r.querySelector("#pno").onclick = closeSheet;
      r.querySelector("#padd").onclick = function () {
        var lines = r.querySelector("#pt").value.split(/\n+/).map(function (l) { return l.trim(); }).filter(Boolean), added = 0, bad = 0;
        var empties = visibleRows().filter(function (x) { return !x.nombre && !x.tel; }); S.rows = S.rows.filter(function (x) { return empties.indexOf(x) < 0; });
        lines.forEach(function (l) {
          var m = l.match(/(?:\+?593[\s.\-]*|0[\s.\-]*)?9(?:[\s.\-]*\d){8}/), row = newRow();
          if (m) { row.tel = m[0].trim(); row.nombre = l.replace(m[0], " ").replace(/[,;:|\-–]+/g, " ").replace(/\s+/g, " ").trim(); var p = normPhone(row.tel); if (p && p !== "fake") row.tel = pretty(p); }
          else { row.nombre = l.replace(/[,;:|]+/g, " ").trim(); }
          row.ver = 1; if (isValid(row)) { row.hora = nowIso(); added++; } else bad++;
          S.rows.push(row);
        });
        S.rows.push(newRow()); save(); closeSheet();
        var box = $("rows"); box.innerHTML = ""; visibleRows().forEach(function (x, i) { box.appendChild(rowEl(x, i + 1)); });
        updateAll(); scheduleSync(1500);
        if (bad) alert2(added + " lead(s) agregados. " + bad + " línea(s) tienen el nombre o el celular mal; quedaron en la lista para que las corrijas.");
      };
    });
  }

  function updateAll() { updateHud(); updateProgress(); updateTeam(); updateRows(); }
  function updateHud() {
    var s = S.salida; if (!s || !$("hud")) return;
    $("hUni").textContent = s.universidad; $("hHasta").textContent = "hasta las " + hm(s.limite);
  }
  function tick() {
    var s = S.salida; if (!s || !$("clock")) return;
    var rem = s.limite - nowMs(), total = Math.max(1, s.limite - s.inicio), hud = $("hud");
    hud.classList.toggle("warn", rem > 0 && rem <= 10 * 60000); hud.classList.toggle("over", rem <= 0);
    $("clock").textContent = (rem < 0 ? "+" : "") + hms(Math.abs(rem));
    $("clocksub").textContent = rem > 0 ? "restantes" : "de más: ya pasó la hora de salida";
    $("tbar").style.width = clamp(rem / total * 100, 0, 100) + "%";
  }
  function updateProgress() {
    var s = S.salida, box = $("prog"); if (!s || !box) return;
    var tot = totalLeads(), meta = Math.max(1, s.meta), pct = Math.round(tot * 100 / meta), mine = mineLeads();
    var msg = tot === 0 ? "¡A por ellos!" : pct < 25 ? "Arrancando" : pct < 50 ? "Buen ritmo" : pct < 75 ? "¡Mitad del camino!" : pct < 100 ? "¡Ya casi!" : "¡Meta cumplida!";
    var el = (nowMs() - s.inicio) / 3600000, pace = "";
    if (el >= 1 / 6 && tot > 0) { var rate = tot / el, proj = Math.round(rate * (s.limite - s.inicio) / 3600000); pace = "Ritmo: " + Math.round(rate) + " leads por hora. A este ritmo llegan a " + proj + " antes de las " + hm(s.limite) + "."; }
    box.classList.toggle("win", pct >= 100);
    box.innerHTML = '<div class="prog-top"><span>LEADS DE LA SALIDA</span><button class="link" id="btnMeta">Meta: ' + s.meta + ' · cambiar</button></div>' +
      '<div class="big"><b>' + tot + '</b><span>/ ' + s.meta + '</span><em>' + pct + '%</em></div>' +
      '<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="' + s.meta + '" aria-valuenow="' + tot + '"><span style="width:' + clamp(pct, 0, 100) + '%"></span><i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i></div>' +
      '<p class="msg">' + msg + (tot > s.meta ? ' +' + (tot - s.meta) + ' extra' : '') + '</p>' + (pace ? '<p class="pace">' + esc(pace) + '</p>' : '') + '<p class="mine">Tus leads: <b>' + mine + '</b> · <button class="link" id="btnMas">+30 min de tiempo</button></p>';
    $("btnMeta").onclick = openMeta;
    $("btnMas").onclick = function () { S.salida.limite += 30 * 60000; save(); queue({ accion: "salida_editar", id: S.salida.id, limite: new Date(S.salida.limite).toISOString() }); updateHud(); tick(); };
    if (pct >= 100 && !S.celebrated[s.id]) { S.celebrated[s.id] = true; save(); confetti(); }
  }
  function openMeta() {
    var m = S.salida.meta;
    sheet('<h3>Meta de esta salida</h3><div class="stepper"><button type="button" id="a1">−</button><input type="number" id="mv" inputmode="numeric" value="' + m + '"><button type="button" id="a2">+</button></div><button class="btn" id="msv">Guardar meta</button><button class="btn ghost small" id="mno">Cancelar</button>', function (r) {
      var inp = r.querySelector("#mv");
      r.querySelector("#a1").onclick = function () { inp.value = Math.max(1, (parseInt(inp.value, 10) || 1) - 5); };
      r.querySelector("#a2").onclick = function () { inp.value = Math.min(1000, (parseInt(inp.value, 10) || 0) + 5); };
      r.querySelector("#mno").onclick = closeSheet;
      r.querySelector("#msv").onclick = function () { var n = parseInt(inp.value, 10); if (n >= 1 && n <= 1000) { S.salida.meta = n; save(); queue({ accion: "salida_editar", id: S.salida.id, meta: n }); closeSheet(); updateProgress(); } };
    });
  }
  function confetti() {
    var cols = ["#70ff71", "#55b149", "#cdfbd3", "#3fa4a3", "#ffffff"];
    for (var i = 0; i < 36; i++) { var c = document.createElement("div"); c.className = "confetti"; c.style.left = Math.random() * 100 + "vw"; c.style.background = cols[i % cols.length]; c.style.animationDelay = Math.random() * .6 + "s"; document.body.appendChild(c); setTimeout((function (n) { return function () { n.remove(); }; })(c), 3600); }
    try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) { }
  }

  function updateTeam() {
    var box = $("team"); if (!box || !S.salida) return;
    var act = S.team.filter(function (t) { return t.activo; }), gone = S.team.filter(function (t) { return !t.activo; });
    var mineById = {}; S.rows.forEach(function (r) { if (isValid(r) && r.sid === S.salida.id && !r.counted) mineById[r.asesor] = (mineById[r.asesor] || 0) + 1; });
    var h = '<h3>Equipo en la salida</h3><p class="hint">Cualquiera puede entrar o irse cuando quiera. Los demás siguen.</p>';
    h += act.map(function (t) {
      var n = (t.leads || 0) + (t.asesor === S.asesor ? (mineById[t.asesor] || 0) : 0);
      return '<div class="team-row"><div class="grow"><b>' + esc(t.asesor) + (t.mid === S.myMid ? ' (tú)' : '') + '</b><small>desde las ' + hm(t.entro) + ' · ' + n + ' leads</small></div><button type="button" data-l="' + esc(t.mid) + '" class="' + (confirmLeave === t.mid ? 'sure' : '') + '">' + (confirmLeave === t.mid ? '¿Seguro?' : 'Se fue') + '</button></div>';
    }).join("");
    h += '<button class="btn ghost small" id="addm">+ Agregar asesor</button>';
    if (gone.length) h += '<p class="hint" style="margin-top:14px"><b>Ya se fueron</b></p>' + gone.map(function (t) { return '<div class="team-row gone"><div class="grow"><b>' + esc(t.asesor) + '</b><small>' + hm(t.entro) + ' – ' + hm(t.salio || nowMs()) + ' · ' + (t.leads || 0) + ' leads</small></div><button type="button" data-b="' + esc(t.asesor) + '">Volvió</button></div>'; }).join("");
    box.innerHTML = h;
    box.onclick = function (e) {
      var l = e.target.closest("[data-l]"), b = e.target.closest("[data-b]");
      if (l) { var mid = l.getAttribute("data-l"); if (confirmLeave === mid) { confirmLeave = ""; memberLeaves(mid); } else { confirmLeave = mid; updateTeam(); setTimeout(function () { if (confirmLeave === mid) { confirmLeave = ""; updateTeam(); } }, 4000); } return; }
      if (b) { addMember(b.getAttribute("data-b")); return; }
      if (e.target.id === "addm") openAdd();
    };
  }
  function openAdd() {
    var free = ASESORES.filter(function (a) { return !S.team.some(function (t) { return t.asesor === a && t.activo; }); });
    sheet('<h3>Agregar asesor</h3><p class="hint">Elige quién se une a la salida.</p><div class="chips">' + free.map(function (a) { return '<button type="button" class="chip" data-a="' + esc(a) + '">' + esc(a) + '</button>'; }).join("") + '</div><label class="lbl" for="nn">Otro nombre</label><input type="text" id="nn" placeholder="Escribe el nombre"><button class="btn" id="nadd">Agregar</button><button class="btn ghost small" id="nno">Cancelar</button>', function (r) {
      r.querySelector("#nno").onclick = closeSheet;
      r.querySelector(".chips").onclick = function (e) { var b = e.target.closest(".chip"); if (b) { addMember(b.getAttribute("data-a")); closeSheet(); } };
      r.querySelector("#nadd").onclick = function () { var v = r.querySelector("#nn").value; if (v.trim()) { addMember(v); closeSheet(); } };
    });
  }

  /* --- resumen --- */
  function screenResumen() {
    var r = S.resumen, p = pending().length, pct = r.meta ? Math.round(r.total * 100 / r.meta) : 0;
    $("app").innerHTML = '<div class="net" id="net" hidden>Sin señal: tus leads quedan guardados y se envían solos cuando vuelva.</div><section class="card"><h2>¡Buen trabajo, ' + esc(S.asesor) + '!</h2><p class="hint">' + esc(r.uni) + '</p>' +
      '<div class="stats"><div class="stat"><b>' + r.mine + '</b><small>leads tuyos</small></div><div class="stat"><b>' + r.total + ' / ' + r.meta + '</b><small>equipo · ' + pct + '% de la meta</small></div>' +
      '<div class="stat"><b>' + hm(r.entro) + ' – ' + hm(r.salio) + '</b><small>tu horario</small></div><div class="stat"><b>' + human(r.salio - r.entro) + '</b><small>tiempo en la salida</small></div></div>' +
      '<p class="hint" id="rp" style="margin-top:12px;font-weight:700">' + (p ? p + ' lead(s) todavía sin enviar. Sigue con señal.' : 'Todos tus leads están enviados.') + '</p>' +
      '<button class="btn small blue" id="rs">Enviar pendientes</button><button class="btn" id="nueva">Nueva salida</button></section>';
    $("net").hidden = online; $("rs").hidden = !p;
    $("rs").onclick = function () { runSync().then(function () { screenResumen(); }); };
    $("nueva").onclick = function () { S.resumen = null; save(); render(); };
  }

  /* ---------- arranque y ciclos ---------- */
  setInterval(tick, 1000);
  setInterval(function () { if (S.pin) { runSync(); } }, 20000);
  setInterval(poll, 25000);
  window.addEventListener("online", function () { setOnline(true); runSync(); });
  window.addEventListener("offline", function () { setOnline(false); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && S.pin) { runSync(); poll(); } });
  online = navigator.onLine !== false;
  render();
  if (S.pin) runSync();
})();
</script>
</body>
</html>
